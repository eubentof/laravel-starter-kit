name: laravel-inertia-starter

services:
    app:
        build:
            context: .
            target: php-dev
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php-fpm', '-t']
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-3000}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy

    node:
        build:
            context: .
            target: node-dev
        working_dir: /var/www/html
        ports:
            - '${VITE_PORT:-5174}:5174'
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
            - vendor:/var/www/html/vendor

    postgres:
        image: postgres:17-alpine
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-starter}
            POSTGRES_USER: ${DB_USERNAME:-starter}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-starter} -d ${DB_DATABASE:-starter}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        command: redis-server --appendonly yes
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAIL_PORT:-1026}:1025'
            - '${FORWARD_MAILPIT_PORT:-8026}:8025'

    queue:
        build:
            context: .
            target: php-dev
        working_dir: /var/www/html
        command: php artisan queue:work --verbose --tries=3 --timeout=90
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        env_file: .env
        depends_on:
            app:
                condition: service_healthy

    scheduler:
        build:
            context: .
            target: php-dev
        working_dir: /var/www/html
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        env_file: .env
        depends_on:
            app:
                condition: service_healthy

volumes:
    node_modules:
    postgres_data:
    redis_data:
    vendor:
